<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription des stagiaires</title>
  <style>
    :root{
      --mocha:#3b2a20; --mocha-deep:#241811; --mocha-soft:#6b4a36;
      --champagne:#f7e7ce; --cream:#fbf3e4; --gold:#d9a441; --gold-soft:#e6c78a;
      --amber:#b5530f; --amber-dark:#8a3e0a;
    }
    *{box-sizing:border-box}
    body{
      font-family:system-ui,'Segoe UI',sans-serif;
      margin:0;padding:24px;min-height:100vh;
      background:linear-gradient(135deg,var(--mocha-deep),var(--mocha),var(--mocha-soft),var(--mocha-deep));
      background-size:300% 300%;
      animation:bgShift 18s ease infinite;
    }
    .card{
      position:relative;overflow:hidden;
      max-width:420px;margin:30px auto;padding:28px 26px 24px;
      background:var(--cream);
      border:1px solid var(--gold-soft);border-radius:16px;
      box-shadow:0 18px 40px #0006,0 0 0 4px #d9a44122;
      animation:riseIn .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .card::before{
      content:"";position:absolute;inset:0 0 auto 0;height:5px;
      background:linear-gradient(90deg,var(--amber),var(--gold),var(--champagne),var(--gold),var(--amber));
      background-size:200% 100%;animation:goldFlow 4s linear infinite;
    }
    h2{
      margin:6px 0 4px;color:var(--mocha);
      font-family:Georgia,'Times New Roman',serif;letter-spacing:.5px;
      animation:fadeIn 1s .2s both;
    }
    label{
      display:block;margin-top:14px;font-weight:600;color:var(--mocha-soft);
      animation:fadeIn .7s both;
    }
    label:nth-of-type(1){animation-delay:.25s}
    label:nth-of-type(2){animation-delay:.35s}
    label:nth-of-type(3){animation-delay:.45s}
    label:nth-of-type(4){animation-delay:.55s}
    input{
      width:100%;padding:10px 12px;margin-top:6px;
      background:#fffaf0;color:var(--mocha);
      border:1px solid #d9c3a0;border-radius:8px;
      transition:border-color .25s,box-shadow .25s,transform .25s,background .25s;
    }
    input:hover{border-color:var(--gold)}
    input:focus{
      outline:none;border-color:var(--amber);background:#fff;
      box-shadow:0 0 0 4px #b5530f26;transform:translateY(-1px);
    }
    input[type=file]::file-selector-button{
      margin-right:10px;padding:6px 12px;border:0;border-radius:6px;cursor:pointer;
      background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--mocha);
      font-weight:600;transition:filter .2s,transform .2s;
    }
    input[type=file]::file-selector-button:hover{filter:brightness(1.08);transform:scale(1.04)}
    button{
      position:relative;overflow:hidden;
      margin-top:22px;width:100%;padding:12px;
      background:linear-gradient(135deg,var(--amber),var(--gold));
      color:#fff8ea;border:0;border-radius:10px;
      font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;
      box-shadow:0 8px 18px #b5530f55;
      transition:transform .25s,box-shadow .25s,filter .25s;
    }
    button::after{
      content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
      background:linear-gradient(120deg,transparent,#ffffff66,transparent);
      transform:skewX(-20deg);
    }
    button:hover{transform:translateY(-2px);box-shadow:0 12px 24px #b5530f77;filter:saturate(1.1)}
    button:hover::after{animation:shine .9s ease}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.6;cursor:wait;animation:pulse 1.2s ease infinite}
    #msg{margin-top:14px;font-weight:600;text-align:center}
    #msg:not(:empty){animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
    .ok{color:#3f7d3a}.ko{color:#a8321d}
    a{
      display:block;text-align:center;margin-top:18px;
      color:var(--amber-dark);font-weight:600;
      text-decoration-color:var(--gold);text-underline-offset:5px;
      transition:color .25s,letter-spacing .25s;
    }
    a:hover{color:var(--amber);letter-spacing:.6px}

    @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes riseIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes goldFlow{to{background-position:200% 0}}
    @keyframes shine{to{left:130%}}
    @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    @keyframes pulse{50%{opacity:.85}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>

</head>
<body>
  <div class="card">
    <h2>Inscription d’un stagiaire</h2>
    <form id="form">
      <label>Nom <input name="nom" required maxlength="100"></label>
      <label>Prénom <input name="prenom" required maxlength="100"></label>
      <label>Ville <input name="ville" required maxlength="100"></label>
      <label>Photo <input type="file" name="photo" accept="image/*" required></label>
      <button type="submit" id="btn">Inscrire</button>
    </form>
    <div id="msg"></div>
    <a href="liste.html">Voir la liste des stagiaires</a>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.textContent = 'Envoi en cours…';
      msg.className = '';
      try {
        const res = await fetch('/api/inscrire.php', { method: 'POST', body: new FormData(form) });
        const data = await res.json();
        msg.textContent = data.message;
        msg.className = data.success ? 'ok' : 'ko';
        if (data.success) form.reset();
      } catch (err) {
        msg.textContent = 'Erreur réseau.';
        msg.className = 'ko';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
