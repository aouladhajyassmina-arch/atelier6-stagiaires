<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    :root{
      --mocha:#3b2a20; --mocha-deep:#241811; --mocha-soft:#6b4a36;
      --champagne:#f7e7ce; --cream:#fbf3e4; --gold:#d9a441; --gold-soft:#e6c78a;
      --amber:#b5530f;
    }
    *{box-sizing:border-box}
    body{
      font-family:system-ui,'Segoe UI',sans-serif;
      margin:0;padding:24px;min-height:100vh;color:var(--champagne);
      background:linear-gradient(135deg,var(--mocha-deep),var(--mocha),var(--mocha-soft),var(--mocha-deep));
      background-size:300% 300%;
      animation:bgShift 18s ease infinite;
    }
    h2{
      text-align:center;color:var(--gold-soft);
      font-family:Georgia,'Times New Roman',serif;letter-spacing:1px;
      animation:fadeIn .9s both;
    }
    #grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:18px;max-width:1000px;margin:auto;
    }
    .card{
      background:var(--cream);color:var(--mocha);
      border:1px solid var(--gold-soft);border-radius:14px;
      padding:14px;text-align:center;
      box-shadow:0 10px 24px #0005;
      animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both;
      transition:transform .3s,box-shadow .3s,border-color .3s;
    }
    .card:nth-child(1){animation-delay:.05s}
    .card:nth-child(2){animation-delay:.12s}
    .card:nth-child(3){animation-delay:.19s}
    .card:nth-child(4){animation-delay:.26s}
    .card:nth-child(5){animation-delay:.33s}
    .card:nth-child(6){animation-delay:.40s}
    .card:nth-child(7){animation-delay:.47s}
    .card:nth-child(8){animation-delay:.54s}
    .card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 18px 34px #000a,0 0 0 3px #d9a44144}
    .card img{
      width:100%;height:180px;object-fit:cover;border-radius:10px;background:#e8d6b8;
      transition:transform .4s,filter .4s;
    }
    .card:hover img{transform:scale(1.03);filter:saturate(1.1)}
    .card h3{margin:12px 0 4px;color:var(--mocha);font-family:Georgia,serif}
    .card p{margin:0;color:var(--amber);font-weight:600}
    a{
      display:block;text-align:center;margin-top:24px;
      color:var(--gold-soft);font-weight:600;text-underline-offset:5px;
      transition:color .25s,letter-spacing .25s;
    }
    a:hover{color:var(--champagne);letter-spacing:.6px}

    @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes riseIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>

</head>
<body>
  <h2>Liste des stagiaires</h2>
  <div id="grid">Chargement…</div>
  <a href="index.html">← Nouvelle inscription</a>

  <script>
    async function charger() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/liste.php');
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        if (data.stagiaires.length === 0) { grid.textContent = 'Aucun stagiaire.'; return; }
        grid.textContent = '';
        data.stagiaires.forEach(s => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = s.photo;
          img.alt = s.prenom + ' ' + s.nom;
          const h = document.createElement('h3');
          h.textContent = s.prenom + ' ' + s.nom;
          const p = document.createElement('p');
          p.textContent = s.ville;
          card.append(img, h, p);
          grid.appendChild(card);
        });
      } catch (e) {
        grid.textContent = 'Erreur de chargement.';
      }
    }
    charger();
  </script>
</body>
</html>
