<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;padding:24px}
    h2{text-align:center}
    #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1000px;margin:auto}
    .card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 10px #0001}
    .card img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#ddd}
    .card h3{margin:10px 0 4px}
    .card p{margin:0;color:#555}
    a{display:block;text-align:center;margin-top:20px}
  </style>
</head>
<body>
  <h2>Liste des stagiaires</h2>
  <div id="grid">Chargement…</div>
  <a href="index.html">← Nouvelle inscription</a>

  <script>
    async function charger() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/liste.php');
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        if (data.stagiaires.length === 0) { grid.textContent = 'Aucun stagiaire.'; return; }
        grid.textContent = '';
        data.stagiaires.forEach(s => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = s.photo;
          img.alt = s.prenom + ' ' + s.nom;
          const h = document.createElement('h3');
          h.textContent = s.prenom + ' ' + s.nom;
          const p = document.createElement('p');
          p.textContent = s.ville;
          card.append(img, h, p);
          grid.appendChild(card);
        });
      } catch (e) {
        grid.textContent = 'Erreur de chargement.';
      }
    }
    charger();
  </script>
</body>
</html>
